name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/city-bus-manager-game-rmdul2
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # the web build doesn't need the Electron binary
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # bake real-city census + street data into the site so players never
      # need the in-browser download; cached so we don't hammer the sources
      - name: Restore baked city packs
        uses: actions/cache@v4
        with:
          path: |
            public/cities/worcester.json.gz
            public/cities/desmoines.json.gz
            public/cities/madison.json.gz
          key: city-packs-v1-${{ hashFiles('scripts/bake-city.mjs', 'src/game/data/pipeline.js') }}
      - name: Bake real-city data (best effort)
        run: |
          node scripts/bake-city.mjs all || \
            echo "::warning::city bake failed — the site will fall back to in-browser downloads"
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
