<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Intralines Bus Simulator</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🚌</text></svg>" />
    <script>
      // Boot safety net. Two jobs:
      // 1) After a deploy, a cached copy of this page can reference hashed
      //    asset files that no longer exist — catch the failed load and
      //    refresh once to pick up the new page.
      // 2) If the app still hasn't rendered a few seconds later, replace
      //    the blank screen with a readable error + recovery buttons.
      (function () {
        var bootError = '';
        window.addEventListener(
          'error',
          function (e) {
            var t = e.target;
            var failedAsset =
              (t && t.tagName === 'SCRIPT' && t.src) ||
              (t && t.tagName === 'LINK' && t.rel === 'stylesheet');
            if (failedAsset && !sessionStorage.getItem('il-reloaded')) {
              sessionStorage.setItem('il-reloaded', '1');
              location.reload();
              return;
            }
            if (e.error) {
              bootError = String((e.error && e.error.stack) || e.message || e.error);
            } else if (failedAsset) {
              bootError = 'A game file failed to load: ' + (t.src || t.href);
            }
          },
          true
        );
        window.addEventListener('unhandledrejection', function (e) {
          if (!bootError) bootError = 'Unhandled: ' + String(e.reason);
        });
        setTimeout(function () {
          var root = document.getElementById('root');
          if (!root || root.childElementCount > 0) return; // app is up
          var splash = document.getElementById('boot-splash');
          if (splash) splash.remove();
          root.innerHTML =
            '<div style="max-width:560px;margin:80px auto;padding:24px;font-family:system-ui,sans-serif;' +
            'background:#fffdf6;border:1px solid #d0c7ae;border-radius:14px;color:#2c2a24">' +
            '<h2 style="margin:0 0 8px">Intralines couldn&rsquo;t start</h2>' +
            '<p style="margin:0 0 14px;opacity:.75">Usually this is a stale cached page after an update. ' +
            'Reload should fix it; if not, clearing the cached map data usually does.</p>' +
            (bootError
              ? '<pre style="white-space:pre-wrap;background:#f3edda;padding:10px;border-radius:8px;' +
                'font-size:12px;max-height:160px;overflow:auto">' +
                bootError.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre>'
              : '') +
            '<div style="display:flex;gap:10px;margin-top:14px">' +
            '<button id="il-reload" style="padding:9px 16px;border-radius:9px;border:none;' +
            'background:#2c2a24;color:#ffe9a8;font-weight:600;cursor:pointer">Reload</button>' +
            '<button id="il-clear" style="padding:9px 16px;border-radius:9px;' +
            'border:1px solid #d0c7ae;background:#fff;cursor:pointer">Clear map cache &amp; reload</button>' +
            '</div>' +
            '<p style="margin:12px 0 0;font-size:12px;opacity:.6">Your saved games are kept either way.</p></div>';
          document.getElementById('il-reload').onclick = function () {
            location.reload();
          };
          document.getElementById('il-clear').onclick = function () {
            try {
              indexedDB.deleteDatabase('intralines');
            } catch (err) {
              /* ignore */
            }
            location.reload();
          };
        }, 4000);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- instant boot splash: pure inline HTML/CSS so it shows even when every
         other asset fails to load. Hidden the moment the app renders. -->
    <div id="boot-splash">
      <div class="bs-card">
        <div class="bs-bus">🚌</div>
        <b>Intralines</b>
        <span>Loading the city…</span>
        <div class="bs-bar"><i></i></div>
      </div>
    </div>
    <style>
      #root:not(:empty) + #boot-splash { display: none; }
      #boot-splash {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: #f3edda; font-family: system-ui, sans-serif; color: #2c2a24;
      }
      #boot-splash .bs-card { text-align: center; }
      #boot-splash .bs-bus { font-size: 42px; }
      #boot-splash b { display: block; font-size: 22px; margin: 6px 0 2px; }
      #boot-splash span { opacity: 0.65; font-size: 14px; }
      #boot-splash .bs-bar {
        width: 180px; height: 6px; margin: 14px auto 0; border-radius: 4px;
        background: rgba(60, 55, 40, 0.15); overflow: hidden;
      }
      #boot-splash .bs-bar i {
        display: block; width: 40%; height: 100%; border-radius: 4px;
        background: #2c2a24; animation: bs-slide 1.1s ease-in-out infinite;
      }
      @keyframes bs-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
