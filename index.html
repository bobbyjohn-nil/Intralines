<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Intralines Bus Simulator</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='-3 -6 48 38' fill='none' stroke='%232c2a24' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'><rect x='-3' y='-6' width='48' height='38' rx='6' fill='%23f3edda' stroke='none'/><path d='M 3 15.6 L 3 6.6 Q 3 4 5.6 4 L 32 4 Q 33.8 4 34.4 5.2 L 37 11.6 L 37 15.8 Q 37 17 35.6 17 L 34.1 17 Q 30.6 12.3 27.1 17 L 13.0 17 Q 9.5 12.3 6.0 17 L 4.4 17 Q 3 17 3 15.6 Z'/><path d='M 29.8 6.4 L 33.1 6.4 L 35.2 11.1 L 29.8 11.1 Z' stroke-width='1.3' opacity='.85'/><rect x='5.4' y='6.4' width='16.6' height='4.3' rx='1.1' stroke-width='1.3' opacity='.85'/><path d='M 10.9 6.4 V 10.7' stroke-width='1.1' opacity='.5'/><path d='M 16.5 6.4 V 10.7' stroke-width='1.1' opacity='.5'/><rect x='23.1' y='5.9' width='2.6' height='10.2' rx='1' stroke-width='1.3' opacity='.75'/><path d='M 5.4 13.4 H 22.0' stroke-width='1.1' opacity='.4'/><circle cx='35.3' cy='14.3' r='.85' fill='%232c2a24' stroke='none'/><circle cx='30.6' cy='18.5' r='2.7' fill='%232c2a24' stroke='none'/><circle cx='9.5' cy='18.5' r='2.7' fill='%232c2a24' stroke='none'/></svg>" />
    <script>
      // Boot safety net. Two jobs:
      // 1) After a deploy, a cached copy of this page can reference hashed
      //    asset files that no longer exist — catch the failed load and
      //    refresh to pick up the new page. The first retry is a plain
      //    reload; if that still lands on the stale page (browsers may
      //    answer it from their HTTP cache) the second one adds a
      //    cache-busting query so the server has to hand over fresh HTML.
      //    main.tsx clears the counter and tidies the URL once the app is
      //    actually running, so the net re-arms for the next deploy.
      // 2) If the app still hasn't rendered a few seconds later, replace
      //    the blank screen with a readable error + recovery buttons.
      (function () {
        var bootError = '';
        var reloadForStaleAssets = function () {
          var tries = 0;
          try {
            tries = parseInt(sessionStorage.getItem('il-reloaded') || '0', 10) || 0;
            sessionStorage.setItem('il-reloaded', String(tries + 1));
          } catch (err) {
            // no sessionStorage: allow exactly the one plain reload
            if (/[?&]fresh=/.test(location.search)) return false;
            tries = 1;
          }
          if (tries === 0) {
            location.reload();
            return true;
          }
          if (tries === 1) {
            // drop any existing query (the app uses none of its own) so the
            // buster can't stack up across attempts
            location.replace(location.href.split('#')[0].split('?')[0] + '?fresh=' + Date.now());
            return true;
          }
          return false; // two goes and still broken — show the error card
        };
        window.addEventListener(
          'error',
          function (e) {
            var t = e.target;
            var failedAsset =
              (t && t.tagName === 'SCRIPT' && t.src) ||
              (t && t.tagName === 'LINK' && t.rel === 'stylesheet');
            if (failedAsset && reloadForStaleAssets()) return;
            if (e.error) {
              bootError = String((e.error && e.error.stack) || e.message || e.error);
            } else if (failedAsset) {
              bootError = 'A game file failed to load: ' + (t.src || t.href);
            }
          },
          true
        );
        window.addEventListener('unhandledrejection', function (e) {
          var reason = String((e.reason && e.reason.message) || e.reason);
          // a code-split chunk that vanished in a deploy fails this way
          if (/dynamically imported module|Importing a module script failed/i.test(reason)) {
            if (reloadForStaleAssets()) return;
          }
          if (!bootError) bootError = 'Unhandled: ' + reason;
        });
        setTimeout(function () {
          var root = document.getElementById('root');
          if (!root || root.childElementCount > 0) return; // app is up
          var splash = document.getElementById('boot-splash');
          if (splash) splash.remove();
          root.innerHTML =
            '<div style="max-width:560px;margin:80px auto;padding:24px;font-family:system-ui,sans-serif;' +
            'background:#fffdf6;border:1px solid #d0c7ae;border-radius:14px;color:#2c2a24">' +
            '<h2 style="margin:0 0 8px">Intralines couldn&rsquo;t start</h2>' +
            '<p style="margin:0 0 14px;opacity:.75">Usually this is a stale cached page after an update. ' +
            'Reload should fix it; if not, clearing the cached map data usually does.</p>' +
            (bootError
              ? '<pre style="white-space:pre-wrap;background:#f3edda;padding:10px;border-radius:8px;' +
                'font-size:12px;max-height:160px;overflow:auto">' +
                bootError.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre>'
              : '') +
            '<div style="display:flex;gap:10px;margin-top:14px">' +
            '<button id="il-reload" style="padding:9px 16px;border-radius:9px;border:none;' +
            'background:#2c2a24;color:#ffe9a8;font-weight:600;cursor:pointer">Reload</button>' +
            '<button id="il-clear" style="padding:9px 16px;border-radius:9px;' +
            'border:1px solid #d0c7ae;background:#fff;cursor:pointer">Clear map cache &amp; reload</button>' +
            '</div>' +
            '<p style="margin:12px 0 0;font-size:12px;opacity:.6">Your saved games are kept either way.</p></div>';
          document.getElementById('il-reload').onclick = function () {
            // always past the HTTP cache: a plain reload is exactly what has
            // already failed to help by the time this card is on screen
            location.replace(location.href.split('#')[0].split('?')[0] + '?fresh=' + Date.now());
          };
          document.getElementById('il-clear').onclick = function () {
            // clear the store CONTENTS and wait for the transaction to
            // commit before reloading — a fire-and-forget deleteDatabase
            // gets blocked by open connections and aborted by the reload,
            // leaving the cache intact
            var done = false;
            var finish = function () {
              if (done) return;
              done = true;
              location.reload();
            };
            setTimeout(finish, 2500); // never leave the player stuck
            try {
              var req = indexedDB.open('intralines', 1);
              req.onupgradeneeded = function () {
                if (!req.result.objectStoreNames.contains('cityPacks')) {
                  req.result.createObjectStore('cityPacks');
                }
              };
              req.onsuccess = function () {
                var db = req.result;
                try {
                  var tx = db.transaction('cityPacks', 'readwrite');
                  tx.objectStore('cityPacks').clear();
                  tx.oncomplete = function () { db.close(); finish(); };
                  tx.onabort = finish;
                  tx.onerror = finish;
                } catch (err) {
                  db.close();
                  finish();
                }
              };
              req.onerror = finish;
              req.onblocked = finish;
            } catch (err) {
              finish();
            }
          };
        }, 4000);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- instant boot splash: pure inline HTML/CSS so it shows even when every
         other asset fails to load. Hidden the moment the app renders. -->
    <div id="boot-splash">
      <div class="bs-card">
        <div class="bs-bus"><svg width="118" height="72" viewBox="0 0 42 26" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M 3 15.6 L 3 6.6 Q 3 4 5.6 4 L 32 4 Q 33.8 4 34.4 5.2 L 37 11.6 L 37 15.8 Q 37 17 35.6 17 L 34.1 17 Q 30.6 12.3 27.1 17L 13.0 17 Q 9.5 12.3 6.0 17L 4.4 17 Q 3 17 3 15.6 Z"/><path d="M 29.8 6.4 L 33.1 6.4 L 35.2 11.1 L 29.8 11.1 Z" stroke-width="1.3" opacity=".85"/><rect x="5.4" y="6.4" width="16.6" height="4.3" rx="1.1" stroke-width="1.3" opacity=".85"/><path d="M 10.9 6.4 V 10.7" stroke-width="1.1" opacity=".5"/><path d="M 16.5 6.4 V 10.7" stroke-width="1.1" opacity=".5"/><rect x="23.1" y="5.9" width="2.6" height="10.2" rx="1" stroke-width="1.3" opacity=".75"/><path d="M 24.4 6.2 V 15.8" stroke-width="1" opacity=".45"/><path d="M 5.4 13.4 H 22.0" stroke-width="1.1" opacity=".4"/><circle cx="35.3" cy="14.3" r=".85" fill="currentColor" stroke="none"/><circle cx="30.6" cy="18.5" r="2.7" fill="currentColor" stroke="none"/><circle cx="9.5" cy="18.5" r="2.7" fill="currentColor" stroke="none"/></svg></div>
        <b>Intralines</b>
        <span>Loading the city…</span>
        <div class="bs-bar"><i></i></div>
      </div>
    </div>
    <style>
      #root:not(:empty) + #boot-splash { display: none; }
      #boot-splash {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: #f3edda; font-family: system-ui, sans-serif; color: #2c2a24;
      }
      #boot-splash .bs-card { text-align: center; }
      #boot-splash .bs-bus { font-size: 42px; }
      #boot-splash b { display: block; font-size: 22px; margin: 6px 0 2px; }
      #boot-splash span { opacity: 0.65; font-size: 14px; }
      #boot-splash .bs-bar {
        width: 180px; height: 6px; margin: 14px auto 0; border-radius: 4px;
        background: rgba(60, 55, 40, 0.15); overflow: hidden;
      }
      #boot-splash .bs-bar i {
        display: block; width: 40%; height: 100%; border-radius: 4px;
        background: #2c2a24; animation: bs-slide 1.1s ease-in-out infinite;
      }
      @keyframes bs-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
